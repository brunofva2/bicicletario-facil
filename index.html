<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gestão de Vagas Suspensas de Bicicletas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Oswald:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="Sistema local de administração predial, cadastro de bicicletas e controle de vagas suspensas (Modo Local Offline)." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bicicletário" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Gestão de Vagas Suspensas de Bicicletas" />
    <meta property="og:description" content="Sistema local de administração predial, cadastro de bicicletas e controle de vagas suspensas (Modo Local Offline)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f1f5f9; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px;">
        <div style="width: 44px; height: 44px; border: 4px solid #cbd5e1; border-top-color: #0f172a; border-radius: 50%; animation: condoSpin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 6px;">Bicicletário Fácil</div>
        <div style="font-size: 13px; color: #64748b;">Iniciando sistema de gestão predial...</div>
        <style>
          @keyframes condoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Unhandled runtime error:', e.error || e.message);
        var errContainer = document.getElementById('runtime-error-banner');
        if (!errContainer) {
          errContainer = document.createElement('div');
          errContainer.id = 'runtime-error-banner';
          errContainer.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#991b1b;color:#fef2f2;padding:16px;z-index:999999;font-family:monospace;font-size:12px;white-space:pre-wrap;box-shadow:0 10px 25px rgba(0,0,0,0.3);';
          errContainer.innerHTML = '<strong>Aviso de Inicialização:</strong><br/>' + (e.message || 'Erro ao carregar script principal') + (e.filename ? '<br/><span style="opacity:0.8;font-size:11px;">(' + e.filename + ':' + e.lineno + ')</span>' : '');
          document.body.appendChild(errContainer);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
