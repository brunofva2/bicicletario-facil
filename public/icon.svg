<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />

  <!-- Suspended ceiling hook track top mount -->
  <g filter="url(#glow)">
    <!-- Rail / Beam -->
    <rect x="156" y="52" width="200" height="14" rx="7" fill="#475569" />
    <!-- Vertical bracket -->
    <rect x="246" y="66" width="20" height="38" rx="4" fill="#64748b" />
    <!-- Hook curve (Suspended Hook) -->
    <path d="M 256 104 C 256 130, 296 130, 296 156 C 296 178, 274 196, 252 196 C 232 196, 218 182, 218 168" 
          fill="none" stroke="url(#hookGrad)" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Bicycle Silhouette (hanging / suspended perspective) -->
  <g transform="translate(0, 30)">
    <!-- Rear Wheel (left) -->
    <circle cx="160" cy="320" r="68" fill="none" stroke="#94a3b8" stroke-width="12" />
    <circle cx="160" cy="320" r="14" fill="#64748b" />
    <line x1="160" y1="252" x2="160" y2="388" stroke="#475569" stroke-width="3" />
    <line x1="92" y1="320" x2="228" y2="320" stroke="#475569" stroke-width="3" />

    <!-- Front Wheel (right) -->
    <circle cx="352" cy="320" r="68" fill="none" stroke="#94a3b8" stroke-width="12" />
    <circle cx="352" cy="320" r="14" fill="#64748b" />
    <line x1="352" y1="252" x2="352" y2="388" stroke="#475569" stroke-width="3" />
    <line x1="284" y1="320" x2="420" y2="320" stroke="#475569" stroke-width="3" />

    <!-- Bike Frame Diamond -->
    <!-- Rear axle (160, 320) to Bottom Bracket (244, 320) -->
    <line x1="160" y1="320" x2="244" y2="320" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Bottom Bracket (244, 320) to Seat Joint (212, 224) -->
    <line x1="244" y1="320" x2="212" y2="224" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Rear axle (160, 320) to Seat Joint (212, 224) -->
    <line x1="160" y1="320" x2="212" y2="224" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Seat Joint (212, 224) to Head Tube (318, 206) -->
    <line x1="212" y1="224" x2="318" y2="206" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Bottom Bracket (244, 320) to Head Tube (318, 206) -->
    <line x1="244" y1="320" x2="318" y2="206" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Front Fork: Head Tube (318, 206) to Front axle (352, 320) -->
    <line x1="318" y1="206" x2="352" y2="320" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Seat Post & Saddle -->
    <line x1="212" y1="224" x2="202" y2="194" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
    <path d="M 176 192 Q 212 188 234 196" fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" />

    <!-- Stem & Handlebar -->
    <line x1="318" y1="206" x2="324" y2="174" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
    <path d="M 308 174 L 334 174 Q 346 174 344 190" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />

    <!-- Chainring / Pedals -->
    <circle cx="244" cy="320" r="22" fill="#334155" stroke="#64748b" stroke-width="4" />
    <line x1="234" y1="306" x2="254" y2="334" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Tag / Badge "PWA DESKTOP" in bottom right -->
  <g transform="translate(186, 436)">
    <rect width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="70" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">VAGAS PRO</text>
  </g>
</svg>
